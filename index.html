<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Circles</title>
    <style>
        body {
            margin: 0;
            background:#EBE77E;
        }
        .bd, div:nth-child(2) {
            width:60px;
            aspect-ratio:1;
            border:20px solid #7E6293;
            border-radius:50%;
            position:absolute;
            inset:50%;
            transform:translate(-50%,-50%);
        }
        .bd {
            width:140px;
        }
        .re {
            position:absolute;
            width:20px;
            height:60px;
            background:#7E6293;
            inset:50%;
            transform:translate(-50%,-100%);
        }
    </style>
</head>
<body>
    <!-- 
    CSS Battles friendly Solution
    
    <div class=bd></div><div></div><div class=re></div><style>body{background:#EBE77E}.bd,div:nth-child(2){width:60px;aspect-ratio:1;border:20px solid #7E6293;border-radius:50%;position:absolute;inset:50%;transform:translate(-50%,-50%)}.bd{width:140px}.re{position:absolute;width:20px;height:60px;background:#7E6293;inset:50%;transform:translate(-50%,-100%)}</style> 
    
    -->

    <div class=bd></div>
    <div></div>
    <div class=re></div>
</body>
</html>
